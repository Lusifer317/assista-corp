<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ASSISTA CORP | Operations Access & Authentication</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-primary, #F7F8F3);
      padding: 1.5rem;
    }
    .auth-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color, #E5E7EB);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.05);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-alert {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.82rem;
      margin-bottom: 1.5rem;
      display: none;
    }
    .auth-alert.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #DC2626;
    }
    .auth-alert.info {
      background: rgba(23, 37, 84, 0.06);
      border: 1px solid rgba(23, 37, 84, 0.15);
      color: var(--brand-navy, #172554);
    }
    .auth-footer {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color, #E5E7EB);
      font-size: 0.8rem;
      color: var(--text-secondary, #5B6472);
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">
      <a href="/" title="Assista Corp" style="display:inline-block;">
        <picture>
          <source srcset="/images/assista-logo.svg" type="image/svg+xml">
          <img src="/images/assista-logo.png" alt="Assista Corp" style="height: 48px; width: auto; margin: 0 auto; display: block;">
        </picture>
      </a>
      <div class="brand-tagline" style="font-size:0.75rem; color:var(--text-secondary, #5B6472); font-weight:600; text-transform:uppercase; letter-spacing:0.06em; margin-top:0.75rem;">Operations Command &amp; CRM</div>
    </div>

    <div id="auth-alert" class="auth-alert" role="status" aria-live="polite"></div>

    <form id="login-form" autocomplete="on">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label class="form-label" for="email">Authorized Email</label>
        <input type="email" id="email" name="email" class="form-input" required autocomplete="username" inputmode="email" placeholder="name@assistacorp.com">
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password" placeholder="Enter your password">
      </div>

      <div class="form-group" id="mfa-group" style="display:none; margin-bottom: 1.25rem;">
        <label class="form-label" for="totp_code">Authenticator code</label>
        <input type="text" id="totp_code" name="totp_code" class="form-input" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" style="letter-spacing: 0.25em; text-align: center; font-size: 1.2rem; font-weight: 700; color: var(--brand-navy, #172554);">
        <span style="font-size: 0.75rem; color: var(--text-secondary, #5B6472); margin-top: 0.35rem; display: block;">
          Enter the current code from your authenticator app.
        </span>
      </div>

      <button type="submit" id="login-btn" class="btn btn-navy" style="width: 100%; padding: 0.85rem; font-size: 0.92rem; margin-top: 0.5rem;">
        Sign in to Operations →
      </button>
    </form>

    <div class="auth-footer">
      Authorized personnel only.
      <br>
      <a href="/" style="display:inline-block; margin-top:0.75rem; color:var(--brand-navy, #172554); font-weight:600;">← Return to Public Website</a>
    </div>
  </main>

  <script src="/js/login.js" defer></script>
</body>
</html>
